[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rod-warszawa-scanner"
version = "0.1.0"
description = "Daily scanner for ROD (Rodzinne Ogrody Działkowe) allotment plots in Warsaw (Mokotów & Ochota)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
rod-scanner = "rod_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rod_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
